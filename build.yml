name: Build OxGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build zip unzip

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build
        run: |
          chmod +x build/*.sh
          cd build
          ./build_all.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OxvgenOS16_KSU_V60_FINAL_COMPILED
          path: "*.zip"
