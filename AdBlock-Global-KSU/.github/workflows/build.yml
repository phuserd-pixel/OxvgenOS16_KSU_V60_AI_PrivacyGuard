name: Build AdBlock Global KSU

on:
  workflow_dispatch:
  push:
    paths:
      - 'AdBlock-Global-KSU/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake zip

      - name: Build module
        run: |
          cd AdBlock-Global-KSU
          chmod +x build_release.sh
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          ./build_release.sh

      - name: Verify ZIP
        run: |
          test -f AdBlock-Global-KSU-v1.0-release.zip
          unzip -l AdBlock-Global-KSU-v1.0-release.zip

      - name: Upload KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AdBlock-Global-KSU-release
          path: AdBlock-Global-KSU/AdBlock-Global-KSU-v1.0-release.zip
